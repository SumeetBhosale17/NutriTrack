<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriTrack | Complete Your Profile</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #f0fdfa, #dbeafe);
      color: #1e293b;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 60px;
      width: 850px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      animation: fadeIn 1.2s ease;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .container:hover {
      transform: translateY(-4px);
      box-shadow: 0 14px 40px rgba(20, 184, 166, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .content {
      width: 100%;
      background: #f9fafb;
      border-radius: 12px;
      padding: 30px 40px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.03);
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: #14b8a6;
      font-size: 2rem;
      filter: drop-shadow(0 0 6px rgba(20,184,166,0.3));
    }

    .verify-section {
      background: rgba(239, 68, 68, 0.08);
      border-left: 4px solid #ef4444;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 25px;
      {% if not user.email_verified %}
      display: block;
      {% else %}
      display: none;
      {% endif %}
    }

    .verify-section p {
      color: #b91c1c;
      margin-bottom: 10px;
    }

    .verify-btn {
      background: linear-gradient(90deg, #f87171, #ef4444);
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .verify-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 10px rgba(239,68,68,0.3);
    }

    .flash {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      background: rgba(20,184,166,0.1);
      color: #0f766e;
      border: 1px solid rgba(20,184,166,0.3);
    }

    .flash.error {
      background: rgba(239,68,68,0.1);
      color: #b91c1c;
      border-color: rgba(239,68,68,0.3);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
    }

    label {
      font-size: 0.9rem;
      color: #475569;
      margin-bottom: 6px;
    }

    input, select {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      padding: 12px;
      border-radius: 8px;
      color: #0f172a;
      outline: none;
      font-size: 0.95rem;
      transition: all 0.3s;
    }

    input:focus, select:focus {
      border-color: #14b8a6;
      box-shadow: 0 0 6px rgba(20,184,166,0.4);
    }

    input[readonly] {
      opacity: 0.8;
      background: #f1f5f9;
      cursor: not-allowed;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: linear-gradient(90deg, #14b8a6, #3b82f6);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    button:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 15px rgba(20,184,166,0.4);
    }

    @media (max-width: 768px) {
      .container {
        width: 90%;
        padding: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Complete Your Profile</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="verify-section">
        <p>⚠️ Your email is not verified. Please verify to secure your account.</p>
        <form method="POST" action="{{ url_for('auth.send_verification') }}">
          <button type="submit" class="verify-btn">Send Verification Link</button>
        </form>
      </div>

      <form method="POST" id="profileForm">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" name="first_name" value="{{ user.first_name }}" readonly />
        </div>

        <div class="form-group">
          <label>Last Name</label>
          <input type="text" name="last_name" value="{{ user.last_name }}" readonly />
        </div>

        <div class="form-group">
          <label>Gender</label>
          <select name="gender" required>
            <option value="" {% if not user.gender %}selected{% endif %}>Select Gender</option>
            <option {% if user.gender=='Male' %}selected{% endif %}>Male</option>
            <option {% if user.gender=='Female' %}selected{% endif %}>Female</option>
            <option {% if user.gender=='Other' %}selected{% endif %}>Other</option>
          </select>
        </div>

        <div class="form-group">
          <label>Age</label>
          <input type="number" name="age" value="{{ user.age or '' }}" placeholder="Enter your age" required />
        </div>

        <div class="form-group">
          <label>Height (cm)</label>
          <input type="number" name="height_cm" value="{{ user.height_cm or '' }}" placeholder="Enter height in cm" required />
        </div>

        <div class="form-group">
          <label>Weight (kg)</label>
          <input type="number" name="weight_kg" value="{{ user.weight_kg or '' }}" placeholder="Enter weight in kg" required />
        </div>

        <div class="form-group">
          <label>Goal</label>
          <select name="goal" required>
            <option value="" {% if not user.goal %}selected{% endif %}>Select Goal</option>
            <option {% if user.goal=='Lose Weight' %}selected{% endif %}>Lose Weight</option>
            <option {% if user.goal=='Maintain Weight' %}selected{% endif %}>Maintain Weight</option>
            <option {% if user.goal=='Gain Weight' %}selected{% endif %}>Gain Weight</option>
          </select>
        </div>

        <div class="form-group">
          <label>Activity Level</label>
          <select name="activity_level" required>
            <option value="" {% if not user.activity_level %}selected{% endif %}>Select Activity Level</option>
            <option value="Sedentary (Little or no exercise)" {% if user.activity_level=='Sedentary (Little or no exercise)' %}selected{% endif %}>Sedentary (Little or no exercise)</option>
            <option value="Lightly Active (1–3 days/week)" {% if user.activity_level=='Lightly Active (1–3 days/week)' %}selected{% endif %}>Lightly Active (1–3 days/week)</option>
            <option value="Moderately Active (3–5 days/week)" {% if user.activity_level=='Moderately Active (3–5 days/week)' %}selected{% endif %}>Moderately Active (3–5 days/week)</option>
            <option value="Very Active (6–7 days/week)" {% if user.activity_level=='Very Active (6–7 days/week)' %}selected{% endif %}>Very Active (6–7 days/week)</option>
            <option value="Super Active (Physical job or athlete)" {% if user.activity_level=='Super Active (Physical job or athlete)' %}selected{% endif %}>Super Active (Physical job or athlete)</option>
          </select>
        </div>

        <button type="submit">Save Profile</button>
      </form>
    </div>
  </div>
</body>
</html>
